<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report - NOTERA</title>
<meta name="theme-color" content="#0e0d0c">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<script>document.documentElement.classList.add('js')</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230e0d0c%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27%23ee4327%27/%3E%3C/svg%3E">
<link rel="preload" href="../../assets/fonts/dela-gothic-one-latin-41f77d.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor/style.css">
<link rel="stylesheet" href="../../assets/vendor/phosphor-fill/style.css">
<link rel="stylesheet" href="../../css/styles.css">
<link rel="stylesheet" href="../../css/pages.css">
</head>
<body>

<header class="nav">
  <a class="nav__brand" href="../../" aria-label="NOTERA home">NOTERA<i class="nav__dot"></i></a>
  <nav class="nav__links" aria-label="Primary">
    <a href="../../#dossier" data-i18n="nav.deliver">What you get</a>
    <a href="../../#process" data-i18n="nav.how">How it works</a>
    <a href="../../#price" data-i18n="nav.price">Price</a>
    <a href="../" aria-current="page" data-i18n="nav.projects">Projects</a>
  </nav>
  <div class="nav__end">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
    <a class="btn btn--sm" href="../../#request" data-i18n="cta.request">Request a research project</a>
  </div>
</header>

<main class="page">
  <div class="wrap reader" id="report" aria-live="polite"></div>
</main>

<aside class="side" id="side" role="dialog" aria-modal="false" aria-labelledby="side-title" hidden>
  <div class="side__head">
    <div>
      <p class="eyebrow" id="side-kicker">Sources</p>
      <p class="side__title" id="side-title"></p>
    </div>
    <button type="button" class="side__x" id="side-x"><i class="ph-bold ph-x" aria-hidden="true"></i><span class="visually-hidden" data-i18n="r.close">Close sources</span></button>
  </div>
  <div class="side__body" id="side-body"></div>
</aside>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Material viewer" hidden>
  <div class="lightbox__bar">
    <p class="lightbox__cap" id="lightbox-cap"></p>
    <a class="pill pill--dark" id="lightbox-dl" href="#" download><i class="ph-bold ph-download-simple" aria-hidden="true"></i><span data-i18n="r.download">Download</span></a>
    <button type="button" class="side__x" id="lightbox-x"><i class="ph-bold ph-x" aria-hidden="true"></i><span class="visually-hidden" data-i18n="r.closeView">Close</span></button>
  </div>
  <div class="lightbox__stage" id="lightbox-stage"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../js/pages.js"></script>
<script src="../../js/report.js"></script>
</body>
</html>
